services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: jarvis-n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5679:5678"
    environment:
      - GENERIC_TIMEZONE=Asia/Kolkata
      - TZ=Asia/Kolkata
      - WEBHOOK_URL=http://localhost:5679/
    volumes:
      - n8n_data:/home/node/.n8n

  postgres:
    image: postgres:16
    container_name: jarvis-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - TZ=Asia/Kolkata
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: jarvis-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      # Inside Docker the services find each other by name, not by localhost.
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - N8N_TICKET_WEBHOOK_URL=http://n8n:5678/webhook/ticket-created
      - N8N_TICKET_UPDATED_WEBHOOK_URL=http://n8n:5678/webhook/ticket-updated
      - N8N_ESCALATION_WEBHOOK_URL=http://n8n:5678/webhook/escalation-created
      - N8N_APPOINTMENT_WEBHOOK_URL=http://n8n:5678/webhook/appointment-created
      - N8N_APPOINTMENT_CANCELLED_WEBHOOK_URL=http://n8n:5678/webhook/appointment-cancelled
      - N8N_APPOINTMENT_RESCHEDULED_WEBHOOK_URL=http://n8n:5678/webhook/appointment-rescheduled
      - N8N_INVOICE_WEBHOOK_URL=http://n8n:5678/webhook/invoice-requested
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  n8n_data:
  pg_data: