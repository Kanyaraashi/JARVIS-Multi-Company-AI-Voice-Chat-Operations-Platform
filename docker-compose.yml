services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: jarvis-n8n
    restart: unless-stopped
    ports:
      - "5679:5678"
    environment:
      - GENERIC_TIMEZONE=Asia/Kolkata
      - TZ=Asia/Kolkata
      - WEBHOOK_URL=http://localhost:5679/
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data: