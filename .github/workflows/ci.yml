name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jarvis
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/jarvis
      JARVIS_APP_DB_PASSWORD: ci-only-password
      N8N_WEBHOOK_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-voice.txt -r requirements-chat.txt pytest
      - name: Migrations apply to an empty database
        run: alembic upgrade head
      - name: Tests (business logic, tenant isolation, security)
        run: python -m pytest -q
